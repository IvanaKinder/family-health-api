services:
  postgres:
    image: postgres:16-alpine
    container_name: family-health-db
    environment:
      POSTGRES_DB: family_health
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
