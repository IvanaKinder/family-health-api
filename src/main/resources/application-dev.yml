app:
  cors:
    allowed-origins:
      - http://localhost:5173

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/family_health
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
