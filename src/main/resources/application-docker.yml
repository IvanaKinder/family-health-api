spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/family_health
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
  liquibase:
    enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000
